<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Based Image Retrieval System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fafafa;
      --bg-white: #ffffff;
      --bg-muted: #f3f3f3;
      --border: #e5e5e5;
      --border-hover: #d0d0d0;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff4ff;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --red: #dc2626;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* === NAV === */
    .nav {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav__brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    /* === HERO === */
    .hero {
      max-width: 620px;
      margin: 0 auto;
      padding: 48px 24px 24px;
      text-align: center;
    }
    .hero__title {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 8px;
    }
    .hero__subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* === TABS === */
    .tabs-wrap {
      display: flex;
      justify-content: center;
      padding: 20px 24px 0;
    }
    .tabs {
      display: inline-flex;
      background: var(--bg-muted);
      border-radius: var(--radius-md);
      padding: 3px;
    }
    .tab {
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active {
      background: var(--bg-white);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* === PANELS === */
    .panel { display: none; }
    .panel.active { display: block; }

    /* === SEARCH BAR === */
    .search-wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }
    .search-bar {
      display: flex;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .search-bar__input {
      flex: 1;
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }
    .search-bar__input::placeholder { color: var(--text-muted); }
    .search-bar__btn {
      padding: 0 18px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-bar__btn:hover { background: var(--accent-hover); }
    .search-bar__btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .search-bar__btn svg { width: 15px; height: 15px; }
    .search-bar__btn .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .search-bar__btn.loading .spinner { display: block; }
    .search-bar__btn.loading svg,
    .search-bar__btn.loading span { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === FOLDER INPUT === */
    .folder-section {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }
    .folder-bar {
      display: flex;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .folder-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .folder-bar__input {
      flex: 1;
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }
    .folder-bar__input::placeholder { color: var(--text-muted); }
    .folder-bar__btn {
      padding: 0 18px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border: none;
      background: var(--text);
      color: white;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .folder-bar__btn:hover { background: #333; }
    .folder-bar__btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* === SCAN STATUS === */
    .scan-status {
      max-width: 600px;
      margin: 12px auto 0;
      padding: 0 24px;
      display: none;
    }
    .scan-status__box {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-white);
    }
    .scan-status__top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .scan-status__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .scan-status__count {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .scan-status__bar {
      width: 100%;
      height: 6px;
      background: var(--bg-muted);
      border-radius: 3px;
      overflow: hidden;
    }
    .scan-status__fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }

    /* Done state */
    .scan-done {
      max-width: 600px;
      margin: 12px auto 0;
      padding: 0 24px;
      display: none;
    }
    .scan-done__box {
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 1px solid #bbf7d0;
      background: var(--green-light);
      font-size: 13px;
      font-weight: 500;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scan-done__box .folder-name {
      color: #15803d;
      font-weight: 600;
    }

    /* === STATS === */
    .stats {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 12px;
      font-size: 13px;
      color: var(--text-muted);
      display: none;
    }
    .stats strong {
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* === GALLERY === */
    .gallery-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    /* === CARD === */
    .card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.3s ease backwards;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .card__img-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--bg-muted);
    }
    .card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .card:hover .card__img { transform: scale(1.03); }
    .card__score {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg-white);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .card__body { padding: 10px 12px 12px; }
    .card__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card__name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 8px;
    }
    .card__badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }
    .card__actions {
      display: flex;
      gap: 6px;
    }
    .btn-sm {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      border-radius: var(--radius-sm);
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
    }
    .btn-sm svg { width: 13px; height: 13px; flex-shrink: 0; }
    .btn-sm--outline {
      color: var(--text-secondary);
      background: var(--bg-muted);
      border: 1px solid var(--border);
    }
    .btn-sm--outline:hover {
      background: var(--border);
      color: var(--text);
    }
    .btn-sm--primary {
      color: white;
      background: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-sm--primary:hover { background: var(--accent-hover); }

    /* === STATES === */
    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
    }
    .state__icon { font-size: 32px; margin-bottom: 12px; }
    .state__title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .state__text { font-size: 13px; color: var(--text-muted); }
    .state__dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
    .state__dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--border-hover);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .state__dot:nth-child(2) { animation-delay: 0.15s; }
    .state__dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* === RESPONSIVE === */
    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .hero { padding: 32px 16px 20px; }
      .search-wrap, .folder-section, .scan-status, .scan-done { padding-left: 16px; padding-right: 16px; }
      .gallery-container { padding: 0 16px 40px; }
      .gallery { grid-template-columns: 1fr 1fr; gap: 10px; }
      .card__actions { flex-direction: column; }
    }
    @media (max-width: 400px) {
      .gallery { grid-template-columns: 1fr; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav__brand">Image Retrieval</div>
  </nav>

  <div class="hero">
    <h1 class="hero__title">Search images by description</h1>
    <p class="hero__subtitle">Find images using natural language — search your own photos or stock image sources.</p>
  </div>

  <!-- Tabs -->
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" data-tab="local">My Computer</button>
      <button class="tab" data-tab="online">Online Sources</button>
    </div>
  </div>

  <!-- ==================== LOCAL PANEL ==================== -->
  <div id="panel-local" class="panel active">

    <!-- Folder input -->
    <div class="folder-section">
      <div class="folder-bar">
        <input id="folder-path" class="folder-bar__input" type="text"
               placeholder="Paste folder path, e.g. D:\Photos" autocomplete="off">
        <button id="scan-btn" class="folder-bar__btn">Analyze Folder</button>
      </div>
    </div>

    <!-- Scan progress -->
    <div id="scan-progress" class="scan-status">
      <div class="scan-status__box">
        <div class="scan-status__top">
          <span class="scan-status__label" id="scan-label">Analyzing images...</span>
          <span class="scan-status__count" id="scan-count">0 / 0</span>
        </div>
        <div class="scan-status__bar">
          <div class="scan-status__fill" id="scan-fill"></div>
        </div>
      </div>
    </div>

    <!-- Scan complete -->
    <div id="scan-done" class="scan-done">
      <div class="scan-done__box">
        <span>&#10003;</span>
        <span id="scan-done-text"></span>
      </div>
    </div>

    <!-- Local search (shown after scan) -->
    <div id="local-search" class="search-wrap" style="display:none;">
      <div class="search-bar">
        <input id="local-query" class="search-bar__input" type="text"
               placeholder="Describe the image you want to find..." autocomplete="off">
        <button id="local-search-btn" class="search-bar__btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Search</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>

    <div id="local-stats" class="stats"></div>
    <div class="gallery-container"><div id="local-gallery" class="gallery"></div></div>
  </div>

  <!-- ==================== ONLINE PANEL ==================== -->
  <div id="panel-online" class="panel">

    <div class="search-wrap">
      <div class="search-bar">
        <input id="online-query" class="search-bar__input" type="text"
               placeholder="Describe the image you want to find..." autocomplete="off">
        <button id="online-search-btn" class="search-bar__btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Search</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>

    <div id="online-stats" class="stats"></div>
    <div class="gallery-container"><div id="online-gallery" class="gallery"></div></div>
  </div>

  <script>
    // =====================================================
    // TABS
    // =====================================================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });

    // =====================================================
    // LOCAL FOLDER — SCAN
    // =====================================================
    const scanBtn = document.getElementById('scan-btn');
    const folderInput = document.getElementById('folder-path');
    const scanProgress = document.getElementById('scan-progress');
    const scanLabel = document.getElementById('scan-label');
    const scanCount = document.getElementById('scan-count');
    const scanFill = document.getElementById('scan-fill');
    const scanDone = document.getElementById('scan-done');
    const scanDoneText = document.getElementById('scan-done-text');
    const localSearch = document.getElementById('local-search');

    let pollTimer = null;

    scanBtn.addEventListener('click', startScan);
    folderInput.addEventListener('keydown', e => { if (e.key === 'Enter') startScan(); });

    // Check if there's a cached scan on page load
    checkExistingScan();

    async function checkExistingScan() {
      try {
        const res = await fetch('/scan-status');
        const s = await res.json();
        if (s.complete && s.folder && s.total > 0) {
          folderInput.value = s.folder;
          showScanDone(s.total, s.folder);
        } else if (s.scanning) {
          folderInput.value = s.folder || '';
          scanBtn.disabled = true;
          scanBtn.textContent = 'Analyzing...';
          showProgress();
          startPolling();
        }
      } catch (e) { /* ignore */ }
    }

    async function startScan() {
      const folder = folderInput.value.trim();
      if (!folder) { folderInput.focus(); return; }

      scanBtn.disabled = true;
      scanBtn.textContent = 'Analyzing...';
      scanDone.style.display = 'none';
      localSearch.style.display = 'none';
      document.getElementById('local-gallery').innerHTML = '';
      document.getElementById('local-stats').style.display = 'none';

      try {
        const res = await fetch('/scan-folder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Failed to start scan.');
          scanBtn.disabled = false;
          scanBtn.textContent = 'Analyze Folder';
          return;
        }

        showProgress();
        startPolling();
      } catch (e) {
        alert('Could not connect to the server.');
        scanBtn.disabled = false;
        scanBtn.textContent = 'Analyze Folder';
      }
    }

    function showProgress() {
      scanProgress.style.display = 'block';
      scanFill.style.width = '0%';
      scanCount.textContent = '0 / 0';
      scanLabel.textContent = 'Analyzing images...';
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/scan-status');
          const s = await res.json();

          if (s.total > 0) {
            const pct = Math.round((s.processed / s.total) * 100);
            scanFill.style.width = pct + '%';
            scanCount.textContent = s.processed + ' / ' + s.total;
          }

          if (!s.scanning) {
            clearInterval(pollTimer);
            pollTimer = null;
            scanProgress.style.display = 'none';
            scanBtn.disabled = false;
            scanBtn.textContent = 'Analyze Folder';

            if (s.error) {
              alert(s.error);
            } else if (s.complete) {
              showScanDone(s.total, s.folder);
            }
          }
        } catch (e) { /* ignore */ }
      }, 400);
    }

    function showScanDone(count, folder) {
      const folderName = folder.split(/[/\\]/).filter(Boolean).pop() || folder;
      scanDoneText.innerHTML = count + ' images ready from <span class="folder-name">' + esc(folderName) + '</span>';
      scanDone.style.display = 'block';
      localSearch.style.display = 'block';
      document.getElementById('local-query').focus();
    }

    // =====================================================
    // LOCAL FOLDER — SEARCH
    // =====================================================
    const localSearchBtn = document.getElementById('local-search-btn');
    const localQueryInput = document.getElementById('local-query');
    const localGallery = document.getElementById('local-gallery');
    const localStats = document.getElementById('local-stats');

    localSearchBtn.addEventListener('click', searchLocal);
    localQueryInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchLocal(); });

    async function searchLocal() {
      const query = localQueryInput.value.trim();
      if (!query) { localQueryInput.focus(); return; }

      localSearchBtn.classList.add('loading');
      localSearchBtn.disabled = true;
      localStats.style.display = 'none';
      localGallery.innerHTML = loadingHTML();

      try {
        const res = await fetch('/search-local', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        localGallery.innerHTML = '';

        if (!data.images || data.images.length === 0) {
          localGallery.innerHTML = emptyHTML();
          return;
        }

        localStats.style.display = 'block';
        localStats.innerHTML = '<strong>' + data.images.length + '</strong> results for "<strong>' + esc(data.query) + '</strong>"';

        data.images.forEach((img, i) => {
          const score = img.score != null ? (img.score * 100).toFixed(1) : null;
          const card = document.createElement('div');
          card.className = 'card';
          card.style.animationDelay = (i * 0.04) + 's';
          card.innerHTML = `
            <div class="card__img-wrap">
              <img class="card__img" src="/local-image?path=${encodeURIComponent(img.path)}" alt="${esc(img.filename)}" loading="lazy">
              ${score != null ? '<span class="card__score">' + score + '%</span>' : ''}
            </div>
            <div class="card__body">
              <div class="card__row">
                <span class="card__name">${esc(img.filename)}</span>
                <span class="card__badge">Local</span>
              </div>
              <div class="card__actions">
                <a class="btn-sm btn-sm--outline" href="/local-image?path=${encodeURIComponent(img.path)}" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  Open
                </a>
                <a class="btn-sm btn-sm--primary" href="/local-image?path=${encodeURIComponent(img.path)}" download="${esc(img.filename)}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Save Copy
                </a>
              </div>
            </div>
          `;
          localGallery.appendChild(card);
        });
      } catch (e) {
        localGallery.innerHTML = errorHTML();
        console.error(e);
      } finally {
        localSearchBtn.classList.remove('loading');
        localSearchBtn.disabled = false;
      }
    }

    // =====================================================
    // ONLINE — SEARCH
    // =====================================================
    const onlineSearchBtn = document.getElementById('online-search-btn');
    const onlineQueryInput = document.getElementById('online-query');
    const onlineGallery = document.getElementById('online-gallery');
    const onlineStats = document.getElementById('online-stats');

    onlineSearchBtn.addEventListener('click', searchOnline);
    onlineQueryInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchOnline(); });

    async function searchOnline() {
      const query = onlineQueryInput.value.trim();
      if (!query) { onlineQueryInput.focus(); return; }

      onlineSearchBtn.classList.add('loading');
      onlineSearchBtn.disabled = true;
      onlineStats.style.display = 'none';
      onlineGallery.innerHTML = loadingHTML();

      try {
        const res = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        onlineGallery.innerHTML = '';

        if (!data.images || data.images.length === 0) {
          onlineGallery.innerHTML = emptyHTML();
          return;
        }

        onlineStats.style.display = 'block';
        onlineStats.innerHTML = '<strong>' + data.images.length + '</strong> results for "<strong>' + esc(data.query) + '</strong>"';

        data.images.forEach((img, i) => {
          const score = img.score != null ? (img.score * 100).toFixed(1) : null;
          const card = document.createElement('div');
          card.className = 'card';
          card.style.animationDelay = (i * 0.04) + 's';
          card.innerHTML = `
            <div class="card__img-wrap">
              <img class="card__img" src="${img.url || ''}" alt="${esc(query)}" loading="lazy">
              ${score != null ? '<span class="card__score">' + score + '%</span>' : ''}
            </div>
            <div class="card__body">
              <div class="card__row">
                <span class="card__name">${esc(img.photographer || 'Unknown')}</span>
                <span class="card__badge">${esc(img.site || '')}</span>
              </div>
              <div class="card__actions">
                <a class="btn-sm btn-sm--outline" href="${img.source || '#'}" target="_blank" rel="noopener">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  Source
                </a>
                <a class="btn-sm btn-sm--primary" href="${img.download || '#'}" target="_blank" rel="noopener" download>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Download
                </a>
              </div>
            </div>
          `;
          onlineGallery.appendChild(card);
        });
      } catch (e) {
        onlineGallery.innerHTML = errorHTML();
        console.error(e);
      } finally {
        onlineSearchBtn.classList.remove('loading');
        onlineSearchBtn.disabled = false;
      }
    }

    // =====================================================
    // HELPERS
    // =====================================================
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function loadingHTML() {
      return `<div class="state">
        <div class="state__dots"><div class="state__dot"></div><div class="state__dot"></div><div class="state__dot"></div></div>
        <div class="state__text">Searching...</div>
      </div>`;
    }

    function emptyHTML() {
      return `<div class="state">
        <div class="state__icon">&#128247;</div>
        <div class="state__title">No images found</div>
        <div class="state__text">Try different or broader search terms.</div>
      </div>`;
    }

    function errorHTML() {
      return `<div class="state">
        <div class="state__icon">&#9888;&#65039;</div>
        <div class="state__text" style="color:var(--red);">Something went wrong. Please try again.</div>
      </div>`;
    }
  </script>
</body>
</html>
