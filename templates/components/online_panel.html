<div class="search-panel">
  <div class="search-wrap">
    <label class="field-label" for="online-query">Describe what you’re looking for</label>
    <div class="search-bar">
      <input id="online-query" class="search-bar__input" type="text"
             placeholder="A cyclist on a quiet road in the fog" autocomplete="off" aria-describedby="online-query-help"
             {% if example %}value="{{ example }}"{% endif %}>
      <button id="online-search-btn" class="search-bar__btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Search</span>
        <div class="spinner"></div>
      </button>
    </div>
    <p class="field-help" id="online-query-help">To rank unwanted details lower, try <code>man -hat</code> or <code>man -"white hat"</code>.</p>
    {% with online_image_search=true %}
      {% include 'components/image_search.html' %}
    {% endwith %}
  </div>

  <div id="online-stats" class="stats-bar">
    <div id="online-stats-text" class="stats-bar__text"></div>
    <div class="filter-group">
      <label for="online-min-confidence" class="filter-group__label">Minimum match score</label>
      <select id="online-min-confidence" class="filter-select">
        <option value="0">All (0%+)</option>
        <option value="30">30%+</option>
        <option value="40">40%+</option>
        <option value="50" selected>50% (Default)</option>
        <option value="60">60%+</option>
        <option value="70">70%+</option>
        <option value="80">80%+</option>
      </select>
    </div>
  </div>
  <div class="gallery-container"><div id="online-gallery" class="gallery" aria-live="polite"></div></div>
</div>
